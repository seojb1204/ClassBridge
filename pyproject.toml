[project]
name = "classbridge"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
# B008: FastAPI의 Depends() 기본값 패턴은 프레임워크 관용구
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
"scripts/gen_api_doc.py" = ["E501"]
