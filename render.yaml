# Render Blueprint for ClassBridge staging (Neon PostgreSQL). The user's actual
# service and third-party secrets must be configured before any deployment.
services:
  - type: web
    name: classbridge
    runtime: python
    plan: free            # 무료 플랜은 15분 무요청 시 휴면 → 첫 접속 지연(docs/deployment.md 참고)
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Migrations use DATABASE_URL_DIRECT (Neon non-pooled connection) when set.
    # If migration fails, the new server does not start; never auto-deploy staging.
    startCommand: alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL  # Neon pooled URL for application traffic, sslmode=require
        sync: false
      - key: DATABASE_URL_DIRECT  # Neon direct URL for Alembic migrations
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: PROFESSOR_EMAILS
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        value: ""
      - key: STAGING_MODE
        value: "true"
      - key: STAGING_ALLOWED_EMAILS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: FEATURE_SURVEYS
        value: "false"
      - key: FEATURE_SUGGESTIONS
        value: "false"
      - key: AI_MODE
        value: disabled
